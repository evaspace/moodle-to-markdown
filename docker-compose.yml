services:
  app:
    build: .
    container_name: epitadoomscrolling_app
    environment:
    - DB_PATH=/data/cards.db
    - MAIL_SERVER=${MAIL_SERVER:-ssl0.ovh.net}
    - MAIL_PORT=${MAIL_PORT:-587}
    - MAIL_USERNAME=${MAIL_USERNAME:-}
    - MAIL_PASSWORD=${MAIL_PASSWORD:-}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz',
        timeout=3)
      timeout: 5s
    ports:
    - 127.0.0.1:5117:5000
    - 172.17.0.1:5080:5000
    restart: always
    volumes:
    # code = live copy (tools/deploy.sh), data = this folder: cards.db, blogbot articles
    - /opt/pierref/epitadoomscrolling-live:/app
    - /opt/pierref/epitadoomscrolling:/data
    - /opt/pierref/epitadoomscrolling/articles:/app/articles
    # course notes (/cours/): git-ignored, so absent from the live copy
    - /opt/pierref/epitadoomscrolling/EPITA_Moodle_Notes_MD:/app/EPITA_Moodle_Notes_MD:ro
