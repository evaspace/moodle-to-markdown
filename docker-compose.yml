services:
  app:
    build: .
    container_name: mathsdoomscroll_app
    volumes:
      - .:/app
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:5080:5000"
    restart: always
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
