<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FFFFFF">
    <title>Maths Doomscrolling</title>
    <meta name="robots" content="all, index, follow">
    <meta name="googlebot" content="all, index, follow">
    <meta name="google-extended" content="all, index, follow">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K7M75BSXGY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-ZK655F8T1W');
    </script>

    <!-- Favicon & OpenGraph (Le petit chat pixel art) -->
    <link rel="icon" type="image/jpeg" href="/static/cat.jpg">
    <link rel="apple-touch-icon" href="/static/cat.jpg">
    <meta property="og:title" content="Maths Doomscrolling">
    <meta property="og:description" content="Fait par Morgan PIERREFEU. Théorèmes, QCM, Vrai/Faux et intuition mathématique pure.">
    <meta property="og:image" content="https://mathsdoomscrolling.pierref.eu/static/cat.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Maths Doomscrolling">
    <meta name="twitter:description" content="Fait par Morgan PIERREFEU. Doomscrolle des maths 🧠🐱">
    <meta name="twitter:image" content="https://mathsdoomscrolling.pierref.eu/static/cat.jpg">

    <!-- Fonts : JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Styles & App -->
    <link rel="stylesheet" href="/static/style.css">
    <script defer src="/static/app.js"></script>
</head>
<body>
    <div id="app-viewport">
        <!-- CANVAS PIXEL GORE -->
        <canvas id="gore-canvas" class="gore-canvas"></canvas>

        <!-- HEADER ÉPURÉ SANS LOGO -->
        <header id="app-header">
                <div class="header-left">
                <button id="header-back-btn" class="header-btn hidden" onclick="goHome()" title="Retour à l'accueil" aria-label="Retour">←</button>
                <button id="search-btn" class="header-btn search-loupe" onclick="openSearch()" title="Rechercher" aria-label="Rechercher">🔍</button>
                <a href="https://morgan.pierref.eu/credits" target="_blank" rel="noopener" class="header-author-link" title="Crédits - Morgan PIERREFEU">
                    Morgan PIERREFEU
                </a>
            </div>

            <div class="header-center">
                <div id="stats-panel" class="stats-badge">
                    <span id="streak-counter" class="streak-pill" title="Série en cours">🔥 <span id="streak-val">0</span></span>
                    <span id="level-display" class="level-pill" title="Niveau">LVL <span id="level-val">1</span></span>
                </div>
            </div>

            <div class="header-right">
            <!-- Bouton Partager avec le petit chat (flat) -->
            <button id="share-btn" class="share-cat-btn" onclick="shareApp()" title="Partager" aria-label="Partager">
                <img src="/static/stand-up-cat-removebg-preview.png" alt="Chat Partage" class="share-cat-icon">
                <span class="share-label">SHARE</span>
            </button>
        </div>
    </header>

    <!-- OVERLAY RECHERCHE -->
    <div id="search-overlay" class="search-overlay hidden">
        <div class="search-overlay-content">
            <input type="text" id="search-input" class="search-input"
                   placeholder="Rechercher un cours, un théorème, un concept..."
                   autocomplete="off" autofocus>
            <div id="search-results" class="search-results"></div>
        </div>
    </div>

        <!-- PROGRESS BAR -->
        <div id="feed-progress-bar" class="progress-bar hidden">
            <div id="feed-progress-fill" class="progress-fill"></div>
        </div>

        <!-- ÉCRAN 1 : ACCUEIL ÉPURÉ (ZÉRO SUPERFLU) -->
        <div id="landing-screen" class="screen visible">
            <div class="landing-content">
                <!-- LE PETIT CHAT SEUL AU CENTRE -->
                <div class="landing-cat-section" onclick="petTheCat()">
                    <div id="landing-cat-bubble" class="cat-speech-bubble hidden">Miaou !</div>
                    <div class="landing-cat-frame">
                        <img src="/static/laying-cat-removebg-preview.png" alt="Le petit chat" class="landing-cat-img state-rest" id="landing-cat-img">
                    </div>
                </div>

                <!-- BOUTON TOUT DOOMSCROLLER -->
                <div class="quick-action-wrap">
                    <button class="quick-all-btn" onclick="launchFeed(null, null)">
                        <span>⚡ TOUT DOOMSCROLLER</span>
                        <span class="quick-all-arrow">→</span>
                    </button>
                </div>

                <!-- LISTE DES MODULES DIRECTE (SANS TITRE NI TEXTE INTERMÉDIAIRE) -->
                <div id="category-list" class="category-list">
                    <div class="loading-state">Chargement des modules...</div>
                </div>

                <!-- LIEN CRÉDITS EN BAS -->
                <div class="landing-credits-footer">
                    <span>
                        Fait par Morgan PIERREFEU
                    </span>
                </div>

                <!-- BOUTONS SOCIAUX EN BAS À DROITE -->
                <div class="social-buttons-bottom">
                    <a href="https://github.com/evaspace" target="_blank" rel="noopener"
                       class="social-btn social-github" title="GitHub" aria-label="GitHub">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M12 .296C5.337.296 0 5.633 0 12.296c0 5.363 3.408 9.92 8.104 11.536.6.112.82-.262.82-.582 0-.288-.01-1.045-.016-2.05-3.318.724-4.02-1.61-4.02-1.61C4.422 17.734 3.631 17.32 3.631 17.32c-1.087-.745.083-.73.083-.73 1.205.085 1.838 1.238 1.838 1.238 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.554-.294-5.236-1.278-5.236-5.685 0-1.238.447-2.25 1.158-3.046-.115-.293-.503-1.472.108-3.068 0 0 .954-.307 3.125 1.164A10.933 10.933 0 0112 4.79c.959.005 1.931.13 2.79.39.002-2.867.002-5.238 0-7.043 0 0 1.81-1.527 3.286-1.25 1.048.33 1.943.97 2.564 1.762.85-.247 1.76-.37 2.67-.37 1.008.001 2.01.124 2.927.37.617-.785 1.51-1.424 2.554-1.762 1.476-1.164 3.28-1.75 7.29-1.75 1.907 1.908 3.06 4.576 3.06 7.49 0 3.457-2.525 6.25-6.088 7.606.668.567 1.257 1.684 1.257 3.39 0 2.442-.02.446-.02 1.008 0 .29-.237.638-.708 1.52-.848 1.826-2.046.956-3.29.36-3.846.436.136.867.284 1.307.435 3.37.172 1.862.846 2.35.964.75 1.941-.003 3.454.443 3.454 2.737h1.9c.001.315.004.727.004 1.233 0 6.735-4.642 11.445-10.96-12.84z"/>
                        </svg>
                    </a>
                    <a href="https://www.linkedin.com/in/morgan-pierrefeu" target="_blank" rel="noopener"
                       class="social-btn social-linkedin" title="LinkedIn" aria-label="LinkedIn">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.287zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.222 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0z"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <!-- ÉCRAN 2 : FEED DE DOOMSCROLLING -->
        <div id="feed-screen" class="screen hidden">
            <!-- Feed scrollable avec snap vertical -->
            <div id="feed" tabindex="0"></div>

            <!-- LE PETIT CHAT EN BAS À DROITE -->
            <div id="bottom-cat-container" class="bottom-cat-wrap">
                <div id="cat-bubble" class="cat-speech-bubble hidden">Miaou !</div>
                <div class="mascot-frame" id="mascot-frame">
                    <img src="/static/laying-cat-removebg-preview.png" id="chill-cat" class="mascot-cat-img state-rest" alt="Petit Chat Focus" onclick="petTheCat()">
                </div>
            </div>

            <!-- Animation Like plein écran -->
            <div id="like-animation">❤️</div>

            <!-- Navigation desktop discrète -->
            <div class="desktop-nav-hint">
                <span>[↓ / ESPACE] suivant</span>
                <span>[↑] précédent</span>
                <span>[←/→] vrai/faux</span>
                <span>[L] like</span>
            </div>
        </div>

        <!-- MODAL DOSSIERS / FAVORIS -->
        <div id="folder-modal" class="modal-backdrop hidden" onclick="if (event.target === this) closeFolderModal()">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>📁 ENREGISTRER DANS UN DOSSIER</h3>
                    <button class="modal-close-btn" onclick="closeFolderModal()">✕</button>
                </div>
                <div id="folder-list" class="folder-list"></div>
                <div class="new-folder-row">
                    <input type="text" id="new-folder-name" placeholder="Nom du dossier..." maxlength="40">
                    <button class="new-folder-btn" onclick="createFolder()">+ CRÉER</button>
                </div>
                <button class="modal-done-btn" onclick="closeFolderModal()">TERMINÉ</button>
            </div>
        </div>

        <!-- TOAST GLOBAL -->
        <div id="toast" class="toast hidden"></div>
    </div>
</body>
</html>
