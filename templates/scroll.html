<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Scroll · {{ subject.titre }}</title>
  {% include "share.html" %}
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=20261122c">
  <link rel="stylesheet" href="/static/footer.css?v=20261124b">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<!-- Same layout as the main feed (index.html): header + full-screen snap-scrolling cards. -->
<div id="app-viewport">
  <header id="app-header">
    <div class="header-left">
      <a class="header-btn" href="/niveaux" title="Mes niveaux" aria-label="Retour à mes niveaux">←</a>
    </div>
    <div class="header-center">
      <span class="stats-badge" id="sc-progress">Notion {{ progress.unlocked }}/{{ progress.total }}</span>
    </div>
    <div class="header-right"></div>
  </header>
  <div id="feed-screen" class="screen" data-subject="{{ subject.id }}">
    <div id="feed" tabindex="0" aria-live="polite">{% include 'footer.html' %}</div>
    <div id="bottom-cat-container" class="bottom-cat-wrap">
      <div id="cat-bubble" class="cat-speech-bubble hidden"></div>
      <div class="mascot-frame"><img src="/static/laying-cat-removebg-preview.png" id="chill-cat" class="mascot-cat-img state-rest" alt="Le chat"></div>
    </div>
  </div>
</div>
<canvas id="gore-canvas" class="gore-canvas" aria-hidden="true"></canvas>
<script src="/static/cat.js?v=20261122"></script>
<script src="/static/copy-for-llm.js?v=1.0.0"></script>
<script src="/static/card-copy.js?v=1"></script>
<script src="/static/scroll.js?v=8"></script>
</body>
</html>
