<!doctype html>
<html lang="fr">
<head>

<script>
  window.dataLayer = window.dataLayer || [];

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>{{ title }} · Epita Doomscrolling</title>
  {% if description %}<meta name="description" content="{{ description }}">{% endif %}
  <link rel="canonical" href="{{ canonical }}">
  <script type="application/ld+json">{{ jsonld | safe }}</script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/docs.css">
  <link rel="stylesheet" href="/static/footer.css?v=20261115">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script defer src="/static/docs.js"></script>
</head>
<body class="docs-page">
  <header class="docs-header">
    <a href="/" class="docs-back">← Doomscroll</a>
    <a href="/cours/README.md" class="docs-index">📚 Tous les cours</a>
  </header>
  <main class="docs-main">
    <nav class="docs-breadcrumb" aria-label="Fil d’Ariane">
      <a href="/cours/README.md">Cours</a><span> / </span>{{ relative_path|e }}
    </nav>
    <article class="docs-article">
      <h1 class="docs-title">{{ title }}</h1>
      <div class="docs-content">{{ content|safe }}</div>
    </article>
    <footer class="docs-footer"><a href="/">Retour au fil de révision →</a></footer>
  </main>
  {% include 'footer.html' %}
</body>
</html>
